<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Workouts — Workout Generator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html"><strong>💪 Workout Generator</strong></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="search.html">Search</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    <li class="nav-item"><a class="nav-link" href="members.html">Team</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <h1 class="mb-4">Find Your Perfect Exercises</h1>
        
        <div class="row">
            <div class="col-md-4">
                <div class="card p-4">
                    <h5 class="mb-3">Search Filters</h5>
                    <div id="filterContainer"></div>
                    <button class="btn btn-primary w-100" id="searchBtn">Search Exercises</button>
                </div>
            </div>

            <div class="col-md-8">
                <div id="results" class="card p-4">
                    <h5>Search Results</h5>
                    <p class="text-muted">Select filters and click "Search Exercises" to see results.</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-4 mt-5">
        <p>&copy; 2026 Workout Generator. Built for VCU INFO 202.</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script>
        // Filter data as objects
        let filters = [
            {
                id: "bodyType",
                label: "Body Type",
                options: [
                    { value: "ectomorph", text: "Ectomorph (Lean)" },
                    { value: "mesomorph", text: "Mesomorph (Athletic)" },
                    { value: "endomorph", text: "Endomorph (Curvy)" }
                ]
            },
            {
                id: "equipment",
                label: "Equipment",
                options: [
                    { value: "barbell", text: "Barbell" },
                    { value: "dumbbell", text: "Dumbbell" },
                    { value: "machine", text: "Machine" },
                    { value: "cable", text: "Cable" },
                    { value: "bodyweight", text: "Bodyweight" }
                ]
            },
            {
                id: "muscleGroup",
                label: "Target Muscle",
                options: [
                    { value: "chest", text: "Chest" },
                    { value: "back", text: "Back" },
                    { value: "shoulders", text: "Shoulders" },
                    { value: "legs", text: "Legs" },
                    { value: "arms", text: "Arms" },
                    { value: "core", text: "Core" }
                ]
            }
        ];

        console.log("Filters loaded:", filters);

        // Get the filter container
        let filterContainer = document.getElementById("filterContainer");

        // Loop through each filter
        filters.forEach(function(filter) {
            // Create label
            let labelHTML = `<label for="${filter.id}" class="form-label">${filter.label}</label>`;
            
            // Create select with default option
            let selectHTML = `<select class="form-select" id="${filter.id}">
                <option value="">-- Select ${filter.label} --</option>`;
            
            // Loop through options and add them
            filter.options.forEach(function(option) {
                selectHTML += `<option value="${option.value}">${option.text}</option>`;
            });
            
            selectHTML += `</select>`;
            
            // Create complete div with label and select
            let filterHTML = `<div class="mb-3">${labelHTML}${selectHTML}</div>`;
            
            // Add to page
            filterContainer.innerHTML += filterHTML;
            
            console.log("Added filter:", filter.label);
        });

        // Get the search button
        let searchBtn = document.getElementById("searchBtn");
        let resultsDiv = document.getElementById("results");

        // Add click event to search button
        searchBtn.addEventListener("click", function() {
            // Get values from dropdowns
            let bodyTypeValue = document.getElementById("bodyType").value;
            let equipmentValue = document.getElementById("equipment").value;
            let muscleValue = document.getElementById("muscleGroup").value;

            // Log the selected values
            console.log("Search filters:", {
                bodyType: bodyTypeValue,
                equipment: equipmentValue,
                muscle: muscleValue
            });

            // Show selected values
            let resultHTML = `<h5>Your Search:</h5>
                <p><strong>Body Type:</strong> ${bodyTypeValue || "Not selected"}</p>
                <p><strong>Equipment:</strong> ${equipmentValue || "Not selected"}</p>
                <p><strong>Muscle:</strong> ${muscleValue || "Not selected"}</p>
                <p class="text-muted mt-3">Exercises will load here when API is connected.</p>`;
            
            resultsDiv.innerHTML = resultHTML;
        });

        console.log("Page loaded - ready to search!");
    </script>
</body>
</html>
