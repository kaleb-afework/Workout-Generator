<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Workouts — Workout Generator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html"><strong>💪 Workout Generator</strong></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="search.html">Search</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    <li class="nav-item"><a class="nav-link" href="members.html">Team</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <h1 class="mb-4">Find Your Perfect Exercises</h1>
        
        <div class="row">
            <div class="col-md-4">
                <div class="card p-4">
                    <h5 class="mb-3">Search Filters</h5>
                    
                    <div class="mb-3">
                        <label for="bodyType" class="form-label">Body Type</label>
                        <select class="form-select" id="bodyType">
                            <option value="">-- Select Body Type --</option>
                            <option value="ectomorph">Ectomorph (Lean)</option>
                            <option value="mesomorph">Mesomorph (Athletic)</option>
                            <option value="endomorph">Endomorph (Curvy)</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="equipment" class="form-label">Equipment</label>
                        <select class="form-select" id="equipment">
                            <option value="">-- Select Equipment --</option>
                            <option value="barbell">Barbell</option>
                            <option value="dumbbell">Dumbbell</option>
                            <option value="machine">Machine</option>
                            <option value="cable">Cable</option>
                            <option value="bodyweight">Bodyweight</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="muscleGroup" class="form-label">Target Muscle</label>
                        <select class="form-select" id="muscleGroup">
                            <option value="">-- Select Muscle --</option>
                            <option value="chest">Chest</option>
                            <option value="back">Back</option>
                            <option value="shoulders">Shoulders</option>
                            <option value="legs">Legs</option>
                            <option value="arms">Arms</option>
                            <option value="core">Core</option>
                        </select>
                    </div>

                    <button class="btn btn-primary w-100" id="searchBtn">Search Exercises</button>
                </div>
            </div>

            <div class="col-md-8">
                <div id="results" class="card p-4">
                    <h5>Search Results</h5>
                    <p class="text-muted">Select filters and click "Search Exercises" to see results.</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-4 mt-5">
        <p>&copy; 2026 Workout Generator. Built for VCU INFO 202.</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
